    <style>
        /* Font display swap for better performance */

    <style>
        /* ENHANCED DESIGN STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Color Variables */
        :root {
            --teal: #26766f;
            --teal-dark: rgb(45, 120, 112);
            --coral: #f97316;
            --purple: #6d28d9;
            --rose: #ec4899;
            --amber: #946200;
            --emerald: #10b981;
            --blue: #3b82f6;
            --indigo: #6366f1;
        }

        /* Skip Link - Accessibility */
        .skip-link {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--teal);
            color: white;
            padding: 12px 24px;
            border-radius: 0 0 8px 8px;
            font-family: proxima-nova, sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            z-index: 10000;
            transition: top 0.3s ease;
        }

        .skip-link:focus {
            top: 0;
            outline: 3px solid var(--purple);
            outline-offset: 2px;
        }

        /* Focus States - Accessibility */
        a:focus-visible,
        button:focus-visible {
            outline: 3px solid var(--purple);
            outline-offset: 2px;
        }

        .nav-btn:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Respect reduced motion preferences */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            html { scroll-behavior: auto; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(61, 153, 145, 0.3); }
            50% { box-shadow: 0 4px 25px rgba(61, 153, 145, 0.5); }
        }

        body {
            font-family: adobe-garamond-pro, serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #f8fafc;
            color: rgba(26, 26, 26, 0.7);
            font-size: 18px;
            line-height: 1.6em;
            font-weight: 400;
            font-style: normal;
            letter-spacing: 0em;
        }

        /* Reading progress bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--teal);
            z-index: 9999;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 0.1s ease-out;
        }

        /* HEADER SECTION */
        .header-section {
            background: #1e293b;
            min-height: 200px;
            position: relative;
        }

        /* HEADER */
        .header-replica {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 1000;
            padding: 0 20px;
            height: 188.328px;
            display: block;
            background: transparent;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Glassmorphism sticky header when scrolled */
        .header-replica.scrolled {
            height: 70px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header-replica.scrolled .logo-icon {
            width: 150px;
            height: auto;
            max-height: 50px;
        }

        .header-replica.scrolled .logo-replica {
            top: 10px;
        }

        .header-replica.scrolled .nav-replica {
            top: 20px;
        }

        .header-replica.scrolled .nav-btn {
            color: var(--teal-dark);
        }

        .header-replica.scrolled .nav-btn.links {
            border-color: var(--teal);
            color: var(--teal);
        }

        .header-replica.scrolled .nav-btn.links:hover {
            background-color: var(--teal);
            color: white;
        }

        .header-replica * {
            pointer-events: all;
        }

        .logo-replica {
            display: inline-block;
            position: absolute;
            top: 20px;
            left: 20px;
            color: transparent;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-icon {
            width: 250px;
            height: 148.328px;
            display: inline;
            max-height: 150px;
            object-fit: contain;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-replica {
            position: absolute;
            top: 70px;
            right: 45px;
            display: flex;
            gap: 0;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-btn {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-family: proxima-nova, sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            line-height: 13px;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        /* Animated underline for nav buttons */
        .nav-btn.contact::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            width: 0;
            height: 2px;
            background: currentColor;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-btn.contact:hover::after {
            width: 100%;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.3);
        }

        .nav-btn.contact {
            padding: 9.75px 13px;
            border: none;
            background: transparent;
            margin: 0;
            display: block;
        }

        .nav-btn.links {
            padding: 13px 19.5px;
            margin-left: 13px;
            border: 2px solid rgb(255, 255, 255);
            border-radius: 300px;
            background-color: transparent;
            color: rgb(255, 255, 255);
            display: block;
        }

        .nav-btn.links:hover {
            background-color: rgb(255, 255, 255);
            color: var(--teal);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.4);
        }

        /* MAIN CONTENT */
        .main-content {
            background-color: white;
            padding: 60px 40px 80px;
            min-height: calc(100vh - 200px);
        }

        .content-wrapper {
            max-width: 740px;
            margin: 0 auto;
            animation: fadeInUp 0.8s ease-out;
        }

        .page-header {
            margin-bottom: 50px;
            text-align: left;
        }

        .page-header p {
            font-family: adobe-garamond-pro, serif;
            font-size: 20px;
            line-height: 1.6em;
            color: rgba(26, 26, 26, 0.7);
            font-weight: 400;
            letter-spacing: 0em;
        }

        /* FORM STYLES */
        form {
            width: 100%;
        }

        .field-list {
            margin-bottom: 30px;
        }

        .form-item {
            margin-bottom: 28px;
        }

        .form-item label.title {
            display: block;
            font-family: proxima-nova, sans-serif;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.2em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(26, 26, 26, 0.7);
            margin-bottom: 10px;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            font-family: adobe-garamond-pro, serif;
            font-weight: 400;
            line-height: 1.6em;
            border: 1px solid rgba(26, 26, 26, 0.12);
            border-radius: 0;
            background-color: white;
            color: rgb(26, 26, 26);
            transition: border-color 0.1s ease;
            -webkit-appearance: none;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(61, 153, 145, 0.1);
        }

        input[type="text"],
        input[type="email"] {
            height: 44px;
        }

        textarea {
            height: 120px;
            resize: vertical;
            min-height: 100px;
            padding-top: 10px;
        }

        /* Required asterisk */
        .required {
            color: #f00;
        }

        /* SUBMIT BUTTON */
        .form-button-wrapper {
            text-align: right;
            margin-top: 30px;
        }

        input[type="submit"] {
            padding: 15px 32px;
            font-size: 12px;
            font-weight: 600;
            font-family: proxima-nova, sans-serif;
            line-height: 1.2em;
            color: rgb(255, 255, 255);
            background: var(--teal);
            border: none;
            border-radius: 300px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-appearance: none;
            box-shadow: 0 4px 15px rgba(61, 153, 145, 0.3);
        }

        input[type="submit"]:hover {
            background: var(--teal-dark);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(61, 153, 145, 0.4);
        }

        input[type="submit"]:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(61, 153, 145, 0.3);
        }

        /* Honeypot field - completely hidden */
        input[name="_gotcha"] {
            display: none !important;
            position: absolute !important;
            left: -5000px !important;
            height: 0 !important;
            width: 0 !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }

        /* Checkbox styling */
        .checkbox-wrapper {
            margin: 28px 0 32px;
            display: flex;
            align-items: flex-start;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 12px;
            margin-top: 3px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: var(--teal);
        }

        .checkbox-wrapper label {
            font-family: adobe-garamond-pro, serif;
            font-size: 15px;
            line-height: 1.6em;
            color: rgba(26, 26, 26, 0.6);
            cursor: pointer;
            flex: 1;
            font-weight: 400;
            letter-spacing: 0em;
        }

        /* FOOTER */
        footer {
            background: #1e293b;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            padding: 64px 32px;
            font-family: adobe-garamond-pro, serif;
            font-size: 18px;
        }

        footer p {
            font-family: adobe-garamond-pro, serif;
            font-size: 18px;
            font-weight: 400;
            line-height: 28.8px;

            margin: 0;
        }

        footer a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: var(--teal);
        }

        footer nav a:hover {
            color: white;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header-replica {
                position: relative;
                background: #1e293b;
                padding: 20px;
                height: auto;
            }

            .logo-replica {
                position: static;
                display: inline-block;
                margin-top: 15px;
            }

            .nav-replica {
                position: static;
                display: inline-block;
                float: right;
                margin-top: 20px;
            }

            .logo-icon {
                width: 180px;
                max-height: 106px;
            }

            /* Improved touch targets for mobile (min 44px) */
            .nav-btn.contact,
            .nav-btn.links {
                padding: 12px 16px;
                min-height: 44px;
            }

            input[type="submit"] {
                width: 100%;
                min-height: 48px;
            }

            .form-button-wrapper {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Reading progress bar -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- Dark Header Section -->
    <div class="header-section">
        <header class="header-replica" id="header">
            <a href="/" class="logo-replica">
                <img class="logo-icon" src="assets/logo-white.webp" alt="Cultural Peace Logo" width="250" height="148">

            </a>
            <nav class="nav-replica" role="navigation" aria-label="Main navigation">
                <a href="contact.html" class="nav-btn contact" aria-current="page">CONTACT</a>
                <a href="links.html" class="nav-btn links">LINKS</a>
            </nav>
        </header>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
        <div class="content-wrapper">
            <div class="page-header">
                <h1 style="font-family: proxima-nova, sans-serif; font-size: 32px; font-weight: 700; color: rgba(26, 26, 26, 0.9); margin-bottom: 20px; letter-spacing: -0.02em;">Contact Us</h1>
                <p>Do you have private questions or enquiries related to this project? Please let us know.</p>
            </div>

            <!-- Contact Form with Formspree -->
            <form action="https://formspree.io/f/mdkdwwop" method="POST">
                <!-- Hidden fields -->
                <input type="hidden" name="_subject" value="Cultural Peace Contact Form">

                <!-- Honeypot field for spam protection (completely hidden) -->
                <input
                    type="text"
                    name="_gotcha"
                    tabindex="-1"
                    autocomplete="off"
                    aria-hidden="true"
                />

                <div class="field-list">
                    <!-- Name Field -->
                    <div class="form-item">
                        <label class="title" for="name-field">
                            Name <span class="required">*</span>
                        </label>
                        <input
                            id="name-field"
                            name="name"
                            type="text"
                            required
                            aria-required="true"
                        />
                    </div>

                    <!-- Email Field -->
                    <div class="form-item">
                        <label class="title" for="email-field">
                            Email <span class="required">*</span>
                        </label>
                        <input
                            id="email-field"
                            name="email"
                            type="email"
                            required
                            aria-required="true"
                        />
                    </div>

                    <!-- Message Field -->
                    <div class="form-item">
                        <label class="title" for="message-field">
                            Message <span class="required">*</span>
                        </label>
                        <textarea
                            id="message-field"
                            name="message"
                            required
                            aria-required="true"
                        ></textarea>
                    </div>

                    <!-- Anti-spam Checkbox -->
                    <div class="checkbox-wrapper">
                        <input
                            type="checkbox"
                            name="privacy_consent"
                            id="privacy-consent"
                            required
                            aria-required="true"
                        />
                        <label for="privacy-consent">
                            I confirm this is a genuine inquiry and I'm not a robot. I agree to the processing of my personal data for the purpose of responding to this inquiry. <span class="required">*</span>
                        </label>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="form-button-wrapper">
                    <input type="submit" value="Submit" />
                </div>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer style="background: #1e293b; padding: 64px 32px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <nav style="margin-bottom: 24px; display: flex; gap: 32px; flex-wrap: wrap; justify-content: center;" aria-label="Footer navigation">
            <a href="/" style="color: rgba(255, 255, 255, 0.6); text-decoration: none; font-family: proxima-nova, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase;">14 Principles</a>
            <a href="links.html" style="color: rgba(255, 255, 255, 0.6); text-decoration: none; font-family: proxima-nova, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase;">Resources</a>
        </nav>
        <p style="font-family: adobe-garamond-pro, Georgia, serif; font-size: 18px; color: rgba(255, 255, 255, 0.5); margin: 0;">2018-26 <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" style="color: rgba(255, 255, 255, 0.5); text-decoration: none;">CC BY 4.0</a></p>
    </footer>

    <!-- JavaScript for interactivity -->
    <script>
        // Throttle function for performance
        function throttle(func, limit) {
            let inThrottle;
            return function() {
                const args = arguments;
                const context = this;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            }
        }

        // Elements
        const header = document.getElementById('header');
        const progressBar = document.getElementById('progressBar');
        const logoWhite = document.querySelector('.logo-icon:not(.logo-dark)');
        const logoDark = document.querySelector('.logo-dark');

        // Scroll handler
        const handleScroll = throttle(() => {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPercent = (scrollTop / docHeight) * 100;

            // Progress bar
            if (progressBar) {
                progressBar.style.transform = 'scaleX(' + Math.min(1, Math.max(0, scrollPercent / 100)) + ')';
            }

            // Sticky header
            if (header) {
                if (scrollTop > 100) {
                    header.classList.add('scrolled');
                    if (logoWhite) logoWhite.style.display = 'none';
                    if (logoDark) logoDark.style.display = 'inline';
                } else {
                    header.classList.remove('scrolled');
                    if (logoWhite) logoWhite.style.display = 'inline';
                    if (logoDark) logoDark.style.display = 'none';
                }
            }
        }, 16);

        window.addEventListener('scroll', handleScroll);

        // Form field animations
        const formItems = document.querySelectorAll('.form-item');
        formItems.forEach((item, index) => {
            item.style.opacity = '0';
            item.style.transform = 'translateY(20px)';
            item.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
            setTimeout(() => {
                item.style.opacity = '1';
                item.style.transform = 'translateY(0)';
            }, 200 + index * 100);
        });
    </script>
