name: Update Footer Year

on:
  schedule:
    - cron: '15 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-year:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current year
        id: year
        run: echo "CURRENT_YEAR=$(date +%y)" >> $GITHUB_OUTPUT

      - name: Update footer year
        run: |
          YEAR=${{ steps.year.outputs.CURRENT_YEAR }}
          # Update pattern: 2018-XX where XX is the 2-digit year
          find ./docs -name "*.html" -exec sed -i -E "s/2018-[0-9]{2}/2018-$YEAR/g" {} \;

      - name: Commit if changed
        run: |
          git diff --quiet || (git config user.email "github-actions[bot]@users.noreply.github.com" && git config user.name "github-actions[bot]" && git add -A && git commit -m "chore: Update footer year to 2018-${{ steps.year.outputs.CURRENT_YEAR }}" && git push)
